[package]
name = "retrodrive-studio"
version = "0.1.0"
description = "RetroDrive Studio desktop backend"
authors = ["an earlier publisher name"]
edition = "2021"

[lib]
name = "retrodrive_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
sysinfo = "0.32"
