[package]
name = "retrodrive-studio"
version = "0.1.0"
license = "Apache-2.0"
description = "RetroDrive desktop backend"
authors = ["RetroDrive"]
edition = "2021"

[lib]
name = "retrodrive_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Theme Studio AI (ADR-118): HTTPS calls from the backend only, using Windows' own TLS and
# certificate store (schannel through native-tls; no bundled certificate list).
ureq = { version = "2.12", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
sysinfo = "0.32"
uuid = { version = "1.29.0", features = ["v4"] }
serde_json = "1.0.154"
sha2 = "0.10"
# Theme Studio bounded PNG normalization; no SVG or runtime downloads.
png = "=0.18.1"
crc32fast = "=1.5.4"
base64 = "=0.23.1"
md-5 = "0.10"
csv = "1"
calamine = { version = "0.38.0", default-features = false }
quick-xml = "0.42"
# Already built for calamine; no new crates (backup .zip files, ADR-096).
zip = { version = "9.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Input", "Win32_Devices_HumanInterfaceDevice", "Win32_Security", "Win32_Security_Credentials"] }
